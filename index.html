<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:#000;
}

/* =========================
   NAVBAR
========================= */
.logo{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
}

.logo img{
    height:52px;
    object-fit:contain;
    transition:0.3s;
}

.logo img:hover{
    transform:scale(1.08);
}

.logo h1{
    font-size:30px;
    font-weight:400;
    color:#111;
    letter-spacing:1px;

    font-family:'Old English Text MT', serif;
}
.logo span{
    color:white;
}

.logo span{
    color:#d4af37;
}
header{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:85px;

    background:#ffffff;

    display:flex;
    align-items:center;

    padding:0 60px;

    z-index:999;

    box-shadow:0 3px 15px rgba(0,0,0,0.15);
}

/* LOGO */
.logo img{
    height:52px;
    object-fit:contain;
}

/* =========================
   HERO
========================= */

.hero{

    width:100%;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.82),
    rgba(0,0,0,0.82)),
    url('https://blogger.googleusercontent.com/img/a/AVvXsEiNdEnBwlXuZEHfmABCku1LtcIJ2UCTeRK6obx7OhgjqO5QGEb1BWTuj8c7dojh20DNLvYV872_pMKcNwcyaNN9m4p_MrlAUWIGzKGhTGQMoMOr_dYKi-n3H7yP6D9h6qIKzLTzwJPBL3ARGVWlYoxJsyaagTzati_A8WkQ8I6Eg2QD6RkZ1-VvGXiW2FnP');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* BOX */

.content-box{

    position:relative;

    width:950px;
    max-width:90%;

    padding:70px 50px;

    border-radius:100px;

    text-align:center;

    background:rgba(0,0,0,0.35);

    overflow:hidden;

    backdrop-filter:blur(5px);

    z-index:1;
}
.content-box::before{

    content:'';

    position:absolute;

    inset:0;

    padding:5px;

    border-radius:100px;

    background:linear-gradient(
    270deg,
    #8f6b12,
    #d4af37,
    #ffe08a,
    #d4af37,
    #8f6b12
    );

    background-size:400% 400%;

    animation:goldMove 6s linear infinite;

    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    z-index:-1;
}
@keyframes goldMove{

    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:400% 50%;
    }

}
/* TITLE */

.content-box h1{

    color:#d4af37;

    font-size:clamp(30px, 8vw, 92px);

    font-weight:600;

    margin-bottom:35px;

    letter-spacing:2px;

    line-height:1.1;

    word-break:break-word;
}

/* TEXT */

.content-box p{

    color:white;

    font-size:28px;
    line-height:1.7;

    margin-bottom:50px;
}

/* BUTTONS */

.button-group{

    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;
    flex-wrap:wrap;
}

.btn{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    min-width:220px;

    padding:18px 35px;

    border:3px solid white;
    border-radius:50px;

    color:white;
    text-decoration:none;

    font-size:21px;
    font-weight:600;

    transition:0.3s;
}

.btn i{
    font-size:23px;
}

.btn:hover{

    background:#d4af37;
    border-color:#d4af37;

    color:black;

    transform:translateY(-4px);
}

/* SCROLL */

.scroll{

    position:absolute;

    bottom:50px;
    left:50%;

    transform:translateX(-50%);

    width:38px;
    height:65px;

    border:2px solid white;
    border-radius:30px;

    display:flex;
    justify-content:center;

    padding-top:10px;
}

.scroll::before{

    content:'';

    width:7px;
    height:15px;

    background:white;

    border-radius:20px;

    animation:scroll 1.5s infinite;
}

@keyframes scroll{

    0%{
        opacity:0;
        transform:translateY(0);
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(18px);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

@keyframes goldBorder{
.content-box{

    width:950px;
    max-width:90%;

    padding:70px 50px;

    border:5px solid transparent;

    #8f6b12,
    #d4af37,
    #ffe08a,
    #d4af37,
    #8f6b12
    ) border-box;

    background-size:400% 400%;

    animation:goldBorder 8s ease infinite;

    backdrop-filter:blur(4px);

    box-shadow:
    0 0 25px rgba(212,175,55,0.25),
    0 0 60px rgba(212,175,55,0.15);
}
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}
}
