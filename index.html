<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:#000;
}

/* =========================
   NAVBAR
========================= */
.logo{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
}

.logo img{
    height:52px;
    object-fit:contain;
    transition:0.3s;
}

.logo img:hover{
    transform:scale(1.08);
}

.logo h1{
    font-size:30px;
    font-weight:700;
    color:black;
    letter-spacing:1px;
}

.logo span{
    color:white;
}

.logo span{
    color:#d4af37;
}
header{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:85px;

    background:#ffffff;

    display:flex;
    align-items:center;

    padding:0 60px;

    z-index:999;

    box-shadow:0 3px 15px rgba(0,0,0,0.15);
}

/* LOGO */
.logo img{
    height:52px;
    object-fit:contain;
}

/* =========================
   HERO
========================= */

.hero{

    width:100%;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.82),
    rgba(0,0,0,0.82)),
    url('https://blogger.googleusercontent.com/img/a/AVvXsEiNdEnBwlXuZEHfmABCku1LtcIJ2UCTeRK6obx7OhgjqO5QGEb1BWTuj8c7dojh20DNLvYV872_pMKcNwcyaNN9m4p_MrlAUWIGzKGhTGQMoMOr_dYKi-n3H7yP6D9h6qIKzLTzwJPBL3ARGVWlYoxJsyaagTzati_A8WkQ8I6Eg2QD6RkZ1-VvGXiW2FnP');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* BOX */

.content-box{

    width:950px;
    max-width:90%;

    padding:70px 50px;

    border:5px solid #d4af37;
    border-radius:100px;

    text-align:center;

    background:rgba(0,0,0,0.15);
}

/* TITLE */

.content-box h1{

    color:#d4af37;

    font-size:92px;
    font-weight:300;

    margin-bottom:35px;

    letter-spacing:2px;
}

/* TEXT */

.content-box p{

    color:white;

    font-size:28px;
    line-height:1.7;

    margin-bottom:50px;
}

/* BUTTONS */

.button-group{

    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;
    flex-wrap:wrap;
}

.btn{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    min-width:220px;

    padding:18px 35px;

    border:3px solid white;
    border-radius:50px;

    color:white;
    text-decoration:none;

    font-size:21px;
    font-weight:600;

    transition:0.3s;
}

.btn i{
    font-size:23px;
}

.btn:hover{

    background:#d4af37;
    border-color:#d4af37;

    color:black;

    transform:translateY(-4px);
}

/* SCROLL */

.scroll{

    position:absolute;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    width:38px;
    height:65px;

    border:2px solid white;
    border-radius:30px;

    display:flex;
    justify-content:center;

    padding-top:10px;
}

.scroll::before{

    content:'';

    width:7px;
    height:15px;

    background:white;

    border-radius:20px;

    animation:scroll 1.5s infinite;
}

@keyframes scroll{

    0%{
        opacity:0;
        transform:translateY(0);
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(18px);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

    .content-box{

        border-radius:50px;
        padding:45px 25px;
    }

    .content-box h1{
        font-size:55px;
    }

    .content-box p{
        font-size:20px;
    }

    .btn{
        width:100%;
        min-width:100%;
    }

    header{
        padding:0 20px;
    }

    .logo img{
        height:42px;
    }
}
@media(max-width:768px){

    /* HEADER */
    header{
        height:65px;
        padding:0 20px;
    }

    .logo img{
        height:38px;
    }

    .logo h1{
        font-size:22px;
    }

    /* BOX */
    .content-box{
        width:90%;
        padding:35px 20px;
        border-radius:45px;
        border-width:3px;
    }

    /* TITLE */
    .content-box h1{
        font-size:42px;
        margin-bottom:20px;
    }

    /* TEXT */
    .content-box p{
        font-size:18px;
        line-height:1.5;
        margin-bottom:30px;
    }

    /* BUTTON */
    .button-group{
        gap:15px;
    }

    .btn{
        min-width:160px;
        padding:13px 20px;
        font-size:15px;
        border-width:2px;
    }

    .btn i{
        font-size:16px;
    }

    /* SCROLL */
    .scroll{
        width:28px;
        height:50px;
    }

}
</style>
